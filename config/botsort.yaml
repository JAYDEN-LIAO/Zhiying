# BoT-SORT tracker config — overrides ultralytics built-in defaults
# Used by YoloDetector._sync_track() via model.track(tracker="...")

tracker_type: botsort       # (str) tracker backend identifier (required)

# Track life cycle
track_high_thresh: 0.25     # first-stage match threshold (ultralytics default)
track_low_thresh: 0.1       # second-stage threshold for low-score recovery
new_track_thresh: 0.25      # threshold to start a new track (ultralytics default)
track_buffer: 120            # frames to keep lost tracks alive (6s @ 20fps)
match_thresh: 0.7           # IoU 匹配门槛 — 太低会导致密集场景 ID 跳变

# Motion
gmc_method: sparseOptFlow   # global motion compensation method

# ReID
with_reid: false            # BoT-SORT 匹配够用, 在线 ReID 耗时+效果差, 关闭
proximity_thresh: 0.5       # (unused, required by ultralytics init)
appearance_thresh: 0.25     # (unused, required by ultralytics init)
model: auto                 # (unused, required by ultralytics init)
fuse_score: true            # fuse detection score with track confidence
