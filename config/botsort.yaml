# BoT-SORT tracker config — overrides ultralytics built-in defaults
# Used by YoloDetector._sync_track() via model.track(tracker="...")

tracker_type: botsort       # (str) tracker backend identifier (required)

# Track life cycle
track_high_thresh: 0.5      # first-stage match threshold
track_low_thresh: 0.1       # second-stage threshold for low-score recovery
new_track_thresh: 0.5       # threshold to start a new track
track_buffer: 120            # frames to keep lost tracks alive (6s @ 20fps)
match_thresh: 0.5           # association sim threshold (lowered for cls-model ReID)

# Motion
gmc_method: sparseOptFlow   # global motion compensation method

# ReID
with_reid: true             # enable ReID appearance embedding (OSNet)
proximity_thresh: 0.5       # min IoU to consider tracks proximate for ReID
appearance_thresh: 0.25     # min appearance similarity for ReID match (lower = more willing to re-id)
model: models/yolo26n-cls.pt  # PyTorch ReID via YOLO backbone (5.6MB, GPU)
fuse_score: true            # fuse detection score with track confidence
