# BoT-SORT + ReID tracker config
# Kalman + IoU + ReID 表观特征加权匹配
# 轨迹稳、跳变少，适合监控/街景/密集人群

tracker_type: botsort

# ── Track 生命周期 ──
track_high_thresh: 0.5      # 一阶高置信匹配门槛（与 confidence 对齐）
track_low_thresh: 0.1       # 二阶低分恢复
new_track_thresh: 0.5       # 新 track 创建门槛（比默认 0.4 提高，减少碎片）
track_buffer: 45             # 丢失保留 4.5s @10fps（足够遮挡恢复，不留尸体）
match_thresh: 0.5           # IoU 匹配阈值（比 0.4 严格，减少密集误匹配）

# ── 全局运动补偿 ──
gmc_method: sparseOptFlow

# ── 在线 ReID ──
with_reid: true
proximity_thresh: 0.5       # IoU 门控：位置远于 0.5 → 禁止 ReID 匹配
appearance_thresh: 0.6      # 表观门控：cos_distance > 0.4 → 拒绝（严格防过度合并）
model: "auto"               # ultralytics 8.4 起 = 检测骨干特征直通，无需独立 ReID 模型
fuse_score: true
