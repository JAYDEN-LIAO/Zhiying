server:
  host: "0.0.0.0"
  port: 8000

database:
  uri: "postgresql+asyncpg://cerno:cerno@localhost:5432/cerno"

storage:
  video_dir: "data/videos"
  artifact_dir: "data/artifacts"

plugins:
  # ── 语音转录（Demo 跳过）──
  transcriber:
    backend: null

  # ── 镜头分割（TransNetV2 神经网络，真实镜头边界检测）──
  segmenter:
    backend: "transnetv2"
    params:
      threshold: 0.5
      scene_min_duration: 1.0

  # ── 物体检测 + 追踪（YOLO11 + 内置 BoT-SORT，默认启用）──
  detector:
    backend: yolo
    model: models/yolo26s.pt
    confidence_threshold: 0.4
    iou_threshold: 0.5
    batch_size: 128
    detection_fps: 15

  # ── OCR（Demo 跳过）──
  ocr:
    backend: null

  # ── 画面描述 via Qwen3-VL 8B 本地视频理解 ──
  captioner:
    backend: "qwen3_vl"
    params:
      model_name: "models/Qwen/Qwen3-VL-8B-Instruct"
      max_new_tokens: 2048
      min_pixels: 200704
      max_pixels: 1003520

  # ── 画面描述 via DashScope API（备选，注释掉上方 qwen25_vl 并取消注释此段即可切回）──
  # captioner:
  #   backend: "qwen_api"
  #   params:
  #     base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  #     api_key: "placeholder"
  #     model_name: "qwen-vl-max"
  #     with_context: true

  # ── 向量编码（本地 GPU，唯一必须本地的模型）──
  # ── 向量编码（本地 GPU）──
  embedder:
    backend: "qwen3_vl_embedding_8b"
    params:
      model_name: "models/Qwen/Qwen3-VL-Embedding-8B"

  # ── 摘要生成 via DeepSeek API（vlm_llm 模式使用）──
  summarizer:
    backend: "vllm"
    base_url: "https://api.deepseek.com/v1"
    api_key: "placeholder"  # 实际值在 config/secrets.yaml
    model_name: "deepseek-chat"
    max_tokens: 2048
    temperature: 0.1

  # ── 动态 Grounding（Demo 跳过）──
  grounding:
    backend: null

  # ── 人脸识别（SCRFD + ArcFace R50 via insightface）──
  face:
    backend: "insightface"
    params:
      det_thresh: 0.5              # SCRFD 检测阈值
      rec_thresh: 0.4              # ArcFace 识别阈值（内部用，聚类由 FaceRunner 做）

  # ── 车牌识别（HyperLPR3 — 专用 LPR 模型）──
  plate:
    backend: "hyperlpr"
    params:
      detect_level: "high"      # low (更快) / high (更准, 640×640)

pipeline:
  sample_fps: 1.0
  scene_min_duration: 1.0
  # chunk 编码：默认关闭（8GB GPU 上帧+文本路已足够）
  # 开启需要较好 GPU（≥12GB VRAM），并确认 encode_video 不 OOM
  chunk_encoding: false
  # 帧编码批大小 — 按 GPU VRAM 调整: 24GB→128, 48GB→256
  encode_batch_size: 256
  # NVDEC 硬解 — 长视频（1h+）收益明显，短视频反而有子进程开销
  # 需要 NVIDIA GPU + FFmpeg 编译 CUDA 支持
  use_nvdec: false
