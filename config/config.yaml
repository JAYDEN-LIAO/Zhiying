server:
  host: "0.0.0.0"
  port: 8000

database:
  uri: "postgresql+asyncpg://cerno:cerno@localhost:5432/cerno"

storage:
  video_dir: "data/videos"
  artifact_dir: "data/artifacts"

plugins:
  # ── 质量检测（本地 FFmpeg）──
  qc:
    backend: "native_qc"

  # ── 语音转录（Demo 跳过）──
  transcriber:
    backend: null

  # ── 镜头分割（固定间隔，无深度学习依赖）──
  segmenter:
    backend: "time_based"
    params:
      segment_duration: 10.0        # 10秒一段，20秒视频 ≈ 2 个场景

  # ── 物体检测（Demo 跳过）──
  detector:
    backend: null

  # ── OCR（Demo 跳过）──
  ocr:
    backend: null

  # ── 画面描述 via DashScope API ──
  captioner:
    backend: "qwen_api"
    params:
      base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
      api_key: "placeholder"  # 实际值在 config/secrets.yaml
      model_name: "qwen-vl-max"

  # ── 向量编码（本地 GPU，唯一必须本地的模型）──
  embedder:
    backend: "qwen3_vl_embedding"

  # ── 摘要生成 via DeepSeek API ──
  summarizer:
    backend: "vllm"
    base_url: "https://api.deepseek.com/v1"
    api_key: "placeholder"  # 实际值在 config/secrets.yaml
    model_name: "deepseek-chat"
    max_tokens: 2048
    temperature: 0.1

  # ── 动态 Grounding（Demo 跳过）──
  grounding:
    backend: null

pipeline:
  sample_fps: 1.0
  scene_min_duration: 1.0
