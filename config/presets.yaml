# Zhiying 场景预设配置
# L1 场景类型 → L2/L3 默认值映射
# 用户可手动覆盖任何默认值（覆盖后 L1 自动变为 custom）

presets:
  general:
    label: "通用"
    description: "均衡模式，适合未知内容类型"
    vision_enabled: true
    audio_enabled: false       # transcriber 插件未启用
    ocr_enabled: false         # OCR 插件未启用
    caption_enabled: true
    detection_enabled: false   # YOLO 插件未实现
    search_index_enabled: true
    summary_enabled: true

  meeting:
    label: "会议"
    description: "以语音和对话为核心（含课堂、访谈、教程）"
    vision_enabled: true
    audio_enabled: true        # 核心：语音转录
    ocr_enabled: true          # 辅助：白板/PPT 文字
    caption_enabled: true
    detection_enabled: false   # YOLO 插件未实现
    search_index_enabled: true
    summary_enabled: true

  surveillance:
    label: "监控"
    description: "固定机位，无音频轨道，纯视觉分析"
    vision_enabled: true
    audio_enabled: false       # 监控通常无音频
    ocr_enabled: false
    caption_enabled: true
    detection_enabled: false   # YOLO 插件未实现
    search_index_enabled: true
    summary_enabled: false     # 逐场景 caption 已足够

  text_recognition:
    label: "文字识别"
    description: "扫描视频中的文件、聊天截图、票据、PPT 等文字内容"
    vision_enabled: true       # 帧处理总开关，OCR 依赖帧抽取
    audio_enabled: false       # 通常无音频
    ocr_enabled: true          # 核心：OCR 文字提取
    caption_enabled: false     # 不需要 VLM 画面描述
    detection_enabled: false   # YOLO 插件未实现
    search_index_enabled: true
    summary_enabled: false     # caption 关闭 → summary 强制关闭

# 模块可用性：控制前端开关是否置灰
# 当对应插件 backend 为 null 时，模块不可用
module_availability:
  audio_enabled: false         # transcriber backend: null
  ocr_enabled: false           # OCR backend: null
  detection_enabled: false     # YOLO 未实现
