# ═══════════════════════════════════════════════════════════
# Captioner 提示词 — native_video (Qwen2.5-VL 本地视频理解)
# ═══════════════════════════════════════════════════════════

caption_default: |
  你是一个专业的视频分析系统。请直接观看这段视频片段，从以下维度进行全面分析，并输出 JSON。

  分析维度：
  1. description: 用一段连贯的中文描述视频片段的完整内容（场景环境、人物、动作过程、氛围光线、显著物体），按时间顺序组织，不要逐条罗列
  2. keywords: 3-5 个中文关键词
  3. objects: 画面中出现的主要物体/实体列表
  4. actions: 画面中的主要动作列表
  5. scene_type: 场景类型（如：户外街道、室内办公室、会议室、家庭客厅、车内等）
  6. lighting: 光线条件（如：自然光白天、人工光室内、暗光夜晚等）

  仅输出 JSON，不要任何其他文字：
  {
    "description": "...",
    "keywords": ["...", "..."],
    "objects": ["...", "..."],
    "actions": ["...", "..."],
    "scene_type": "...",
    "lighting": "..."
  }

caption_with_context: |
  上一个镜头的结构化描述为：
  {prev_caption}

  请直接观看当前视频片段，结合上一镜头的内容，从以下维度进行分析，着重说明变化和延续。输出 JSON。

  分析维度：
  1. description: 连贯描述本片段内容，着重说明与上一镜头的场景变化、人物增减、动作承接、氛围转折
  2. keywords: 3-5 个中文关键词
  3. objects: 新出现或延续的主要物体/实体列表
  4. actions: 主要动作列表
  5. scene_type: 场景类型
  6. lighting: 光线条件

  仅输出 JSON，不要任何其他文字：
  {
    "description": "...",
    "keywords": ["...", "..."],
    "objects": ["...", "..."],
    "actions": ["...", "..."],
    "scene_type": "...",
    "lighting": "..."
  }

# ═══════════════════════════════════════════════════════════
# Captioner 提示词 — vlm_llm (传统 VLM 看图说话 + LLM 拼凑)
# ═══════════════════════════════════════════════════════════

caption_vlm: |
  你是一个专业的视频分析系统。以下是某段视频片段中按时间顺序截取的若干帧画面。

  请从以下 5 个维度进行全面、客观的描述，尽可能覆盖所有适用维度：

  1. 场景环境
     - 室内还是室外？具体是哪种场所（办公室/街道/庭院/车内/会议室/家庭/商店等）？
     - 空间有何特征（开阔/封闭/整洁/杂乱/明亮/昏暗等）？

  2. 人物
     - 有几个人？性别、大致年龄、衣着颜色和类型如何？
     - 表情和神态怎样（专注/微笑/严肃/疲惫/兴奋等）？
     - 人物之间的相对位置和互动关系如何？

  3. 动作与过程
     - 每个人正在做什么？动作在帧序列间有什么变化？
     - 人物与物体之间有何交互（操作/拿取/使用/书写等）？

  4. 氛围与光线
     - 光线条件（明亮/昏暗/自然光/人工光）？
     - 季节或天气线索（树木状态、天空颜色、穿着厚度等）？
     - 整体氛围基调（正式/轻松/温馨/紧张/教学/日常等）？

  5. 显著物体
     - 画面中突出的物品、设备或道具（电脑/咖啡杯/工具/车辆/书籍等）？

  按时间顺序组织语言，形成连贯叙事，不要逐条罗列。

caption_vlm_with_context: |
  上一个镜头的画面描述为：{prev_caption}

  以下是当前视频片段中按时间顺序截取的若干帧画面。

  请结合上一镜头的内容，从以下维度进行连贯描述，着重说明变化和延续：
  1. 场景环境是否有变化（室内外切换、位置移动等）？
  2. 人物是否有增减或状态改变？
  3. 动作如何承接上一镜头？
  4. 氛围或光线是否有转折？
  5. 是否有新的重要物体出现？

# ── Summarizer 提示词 ──────────────────────────────

summary_system: |
  你是一个专业的视频内容分析助手。
  根据视频的场景描述（已按时间排序），生成结构化的 JSON 摘要。

  输出要求：
  - one_liner：一句话准确概括视频核心内容
  - scenes_summary：每个场景的完整描述
  - tags：从下方分类体系中各选一词，组成 5 个标签
  - main_topics：2-3 个自由主题词
  - main_entities：视频中出现的关键人物名称或实体名称

  标签分类体系（仅当 caption 中有明确依据时才选，无依据则跳过）：
  场景：室内 | 户外 | 车内 | 餐饮 | 运动 | 办公 | 其他
  人物：单人 | 双人 | 多人 | 无人
  动作：对话 | 操作 | 行走 | 演讲 | 饮食 | 运动 | 演示 | 静止
  光线：自然光 | 人工光 | 混合光 | 暗光
  基调：正式 | 轻松 | 温馨 | 教学 | 娱乐 | 严肃 | 活力

summary_user: |
  以下是视频的场景描述（按时间顺序）：

  {caption_timeline}

  请按 JSON 格式输出（不要其他内容）：
  {{
    "one_liner": "一句话准确概括整个视频内容",
    "scenes_summary": [
      {{
        "scene_index": 0,
        "start_sec": 0.0,
        "end_sec": 10.0,
        "description": "该场景的完整过程描述",
        "keywords": ["关键词1", "关键词2"]
      }}
    ],
    "tags": ["有依据的标签1", "有依据的标签2"],
    "main_topics": ["主题1", "主题2"],
    "main_entities": ["人物或实体1", "实体2"]
  }}

# ── Grounding 提示词 ───────────────────────────────

grounding_caption: |
  请在当前画面中精准定位出以下物体的位置，并返回检测框: {query_text}
