
services:
  db:
    image: pgvector/pgvector:pg17  # PostgreSQL 17 + pgvector
    container_name: zhiying_postgres
    environment:
      POSTGRES_USER: zhiying
      POSTGRES_PASSWORD: zhiying
      POSTGRES_DB: zhiying
    ports:
      - "5432:5432"                       # 映射至宿主机，对齐 localhost:5432 契约
    volumes:
      - zhiying_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhiying -d zhiying"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - zhiying_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zhiying_app
    ports:
      - "8011:8011"
    environment:
      - POSTGRES_URI=postgresql+asyncpg://zhiying:zhiying@db:5432/zhiying  # 容器间通信使用 db 服务名
    volumes:
      - .:/home/zhiying/project
      - /home/zhiying/data:/home/zhiying/data  # 挂载视频数据存放目录
    depends_on:
      db:
        condition: service_healthy
    networks:
      - zhiying_network

volumes:
  zhiying_db_data:

networks:
  zhiying_network:
    driver: bridge
