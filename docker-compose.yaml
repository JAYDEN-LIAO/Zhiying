# 仅数据库服务——后端/桌面端直接跑宿主机（生产 systemd，桌面内嵌 pg）；
# run.py 数据库自举与 desktop/db.py 的 docker 回退只用到本文件的 db 服务。
services:
  db:
    image: pgvector/pgvector:pg17  # PostgreSQL 17 + pgvector
    container_name: zhiying_postgres
    environment:
      POSTGRES_USER: zhiying
      POSTGRES_PASSWORD: zhiying
      POSTGRES_DB: zhiying
    ports:
      - "5432:5432"                       # 映射至宿主机，对齐 localhost:5432 契约
    volumes:
      - zhiying_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhiying -d zhiying"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  zhiying_db_data:
